<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <h1 class="bg-yellow-100 p-5 mb-3 text-center text-lg">
        Welcome
    </h1>

    <div class="flex flex-col justify-center h-screen items-center">
        <div class="flex gap-3 items-center">
            <label>Student Mark:</label>
            <input
                type="text"
                class="border markGiven p-2"
                placeholder="Enter Your Mark"
            >
        </div>

        <button
            onclick="gradeSystem()"
            class="bg-black text-white w-64 mt-4 rounded p-2"
        >
            Click
        </button>
    </div>

    <script>
        const gradeSystem = () => {
            const mark = Number(document.querySelector(".markGiven").value);

            if (mark >= 90 && mark <= 100) {
                console.log("Grade A");
            } else if (mark >= 80 && mark < 90) {
                console.log("Grade B");
            } else if (mark >= 70 && mark < 80) {
                console.log("Grade C");
            } else if (mark >= 60 && mark < 70) {
                console.log("Grade D");
            } else {
                console.log("Fail");
            }
        };
    </script>
</body>
</html>
