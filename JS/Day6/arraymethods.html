<script>
const heroes1 = ["Vijay", "Ajith", "Suriya"];

const upperHeroes = heroes1.map(hero => hero.toUpperCase());
console.log(upperHeroes);


const collections1 = [100, 200, 300, 400];

const multiplied = collections1.map(collection => collection * 10);
console.log(multiplied);


const movies1 = ["GOAT", "Leo", "Master"];

const movieNames = movies1.map(movie => `Movie : ${movie}`);
console.log(movieNames);



// Task 4 - filter()
const collections2 = [100, 500, 800, 200, 900];

const greaterThan500 = collections2.filter(collection => collection > 500);
console.log(greaterThan500);


// Task 5 - filter()
const marks1 = [35, 80, 20, 90, 45];

const passedStudents = marks1.filter(mark => mark >= 35);
console.log(passedStudents);



// Task 6 - filter()
const heroes2 = ["Vijay", "Ajith", "SK", "Suriya"];

const longNames = heroes2.filter(hero => hero.length > 4);
console.log(longNames);

// Task 7 - find()
const heroes3 = ["Vijay", "Ajith", "Suriya"];

const foundHero = heroes3.find(hero => hero === "Ajith");
console.log(foundHero);

// Task 8 - find()
const collections3 = [100, 500, 800, 200];

const firstGreaterThan400 = collections3.find(collection => collection > 400);
console.log(firstGreaterThan400);


// Task 9 - findIndex()
const heroes4 = ["Vijay", "Ajith", "Suriya"];

const suriyaIndex = heroes4.findIndex(hero => hero === "Suriya");
console.log(suriyaIndex);

// Task 10 - findIndex()
const movies2 = ["GOAT", "Leo", "Master"];

const leoIndex = movies2.findIndex(movie => movie === "Leo");
console.log(leoIndex);

// Task 11 - some()
const marks2 = [35, 80, 20, 90];

const hasFailed = marks2.some(mark => mark < 35);
console.log(hasFailed);


// Task 12 - some()
const collections4 = [100, 200, 900];

const crossed800 = collections4.some(collection => collection > 800);
console.log(crossed800);



// Task 13 - every()
const marks3 = [50, 70, 90, 40];

const allPassed = marks3.every(mark => mark >= 35);
console.log(allPassed);



// Task 14 - every()
const ages = [20, 25, 30, 35];

const above18 = ages.every(age => age > 18);
console.log(above18);



// Task 15 - reduce()
const collections5 = [100, 200, 300, 400];

const totalCollection = collections5.reduce((total, collection) => total + collection, 0);
console.log(totalCollection);



// Task 18 - Array of Objects (map)
const students1 = [
  { id: 1, name: "Bharath" },
  { id: 2, name: "Vijay" }
];

const studentNames = students1.map(student => student.name);
console.log(studentNames);

// Task 19 - Array of Objects (filter)
const students2 = [
  { id: 1, age: 20 },
  { id: 2, age: 30 },
  { id: 3, age: 18 }
];

const ageAbove20 = students2.filter(student => student.age > 20);
console.log(ageAbove20);


// Task 20 - Array of Objects (find)
const students3 = [
  { id: 1, name: "Sudhan" },
  { id: 2, name: "Rahul" }
];

const student = students3.find(student => student.id === 2);
console.log(student);

</script>
