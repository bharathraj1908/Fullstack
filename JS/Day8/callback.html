<script>
    // ==============================
// Scope Tasks
// ==============================

// Task 1
let hero = "Vijay";

function showHero() {
    console.log("Inside Function:", hero);
}
showHero();

if (true) {
    console.log("Inside If Block:", hero);
}

for (let i = 0; i < 1; i++) {
    console.log("Inside Loop:", hero);
}


// Task 2
const movie = () => {
    let collection = 800;
    console.log("Inside Function:", collection);
};

movie();



// Task 3
if (true) {
    var actor1 = "Ajith";
    let actor2 = "Vijay";
}

console.log("actor1:", actor1); // Works


// Task 4
function showMovie() {
    console.log("GOAT Movie Released");
}

showMovie();


// Task 5
const add = (a, b) => {
    console.log("Sum =", a + b);
};

add(10, 20);



// Task 6
function booking(callback) {
    callback();
}

booking(() => {
    console.log("Booking Confirmed");
});


// Task 7
setTimeout(() => {
    console.log("Movie Started");
}, 2000);



// Task 8
function processOrder(callback) {
    console.log("Order Received");
    callback();
}

processOrder(() => {
    console.log("Order Delivered");
});



// Task 9
function counter() {
    let count = 0;

    return function () {
        count++;
        console.log("Count:", count);
    };
}

const increment = counter();

increment();
increment();
increment();


// Task 10
function bankAccount() {
    let balance = 5000;

    return {
        deposit(amount) {
            balance += amount;
            console.log("Deposited:", amount);
        },

        withdraw(amount) {
            balance -= amount;
            console.log("Withdrawn:", amount);
        },

        checkBalance() {
            console.log("Final Balance:", balance);
        }
    };
}

const account = bankAccount();

account.deposit(1000);
account.withdraw(500);
account.checkBalance();
</script>
