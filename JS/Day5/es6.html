<script>
    // Task 1 - let
let userName = "Bharath";
console.log("Before Change:", userName);

userName = "Raj";
console.log("After Change:", userName);


// Task 2 - let Scope
if (true) {
    let message = "Hello JavaScript";
    console.log(message);
}


// Task 3 - const
const courseName = "MERN";
console.log(courseName);



// Task 4 - Arrow Function
const greet = () => {
    console.log("Welcome To JavaScript");
};

greet();


// Task 5 - Arrow Function With Parameters
const showHero = (heroName) => {
    console.log(`Hero Name : ${heroName}`);
};

showHero("Vijay");


// Task 6 - Arrow Function Addition
const add = (a, b) => {
    console.log(a + b);
};

add(10, 20);


// Task 7 - Template Literals
let hero = "Vijay";
console.log(`My Favourite Hero is ${hero}`);


// Task 8 - Template Literals Multiple Values
let name = "Bharath";
let course = "MERN";
let city = "Chennai";

console.log(`My name is ${name}, I am studying ${course} course and I am from ${city}.`);


// Task 9 - Array Destructuring
let heroes = ["Vijay", "Ajith", "Suriya"];

let [hero1, hero2] = heroes;

console.log(hero1);
console.log(hero2);


// Task 10 - Object Destructuring
let student = {
    name: "Bharath",
    course: "MERN",
    city: "Chennai"
};

let { name: studentName, course: studentCourse } = student;

console.log(studentName);
console.log(studentCourse);
</script>
