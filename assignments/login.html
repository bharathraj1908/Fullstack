<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed,#ec4899);
}

.container{
    width:350px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>Login</h2>

<input
type="text"
id="mobile"
placeholder="Enter 10 Digit Mobile Number"
maxlength="10">

<input
type="password"
id="password"
placeholder="Enter 5 Digit Password"
maxlength="5">

<button onclick="login()">
Login
</button>

<p id="message"></p>

</div>

<script>

const login = () =>{

let mobile=document.getElementById("mobile").value;

let password=document.getElementById("password").value;

let message=document.getElementById("message");

if(mobile.length===10 && password.length===5){

message.style.color="green";
message.innerHTML="Login Successful";


window.location.href="suma.html";

}

else{

message.style.color="red";
message.innerHTML="Enter a valid 10 digit Mobile Number and 5 digit Password.";

}

}

</script>

</body>
</html>
