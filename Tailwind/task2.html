<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="p-10 bg-gray-100">

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

        <div class="bg-blue-300 p-10 rounded text-center">Box 1</div>
        <div class="bg-green-300 p-10 rounded text-center">Box 2</div>
        <div class="bg-yellow-300 p-10 rounded text-center">Box 3</div>
        <div class="bg-pink-300 p-10 rounded text-center">Box 4</div>
        <div class="bg-purple-300 p-10 rounded text-center">Box 5</div>
        <div class="bg-orange-300 p-10 rounded text-center">Box 6</div>

    </div>

</body>
</html>
