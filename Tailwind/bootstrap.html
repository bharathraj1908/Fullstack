<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Basics</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Background Color & Text Color -->
    <div class="bg-primary text-white text-center p-4">
        <h1>Welcome to Bootstrap</h1>
        <p>Learning Bootstrap Basic Utilities</p>
    </div>

    <!-- Container -->
    <div class="container mt-4">

        <!-- Alert -->
        <div class="alert alert-success">
            This is a Success Alert!
        </div>

        <!-- Buttons -->
        <button class="btn btn-primary">Primary Button</button>
        <button class="btn btn-danger">Danger Button</button>

        <!-- Card -->
        <div class="card mt-4" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title text-primary">Bootstrap Card</h5>
                <p class="card-text">
                    This is a simple Bootstrap card example.
                </p>
                <a href="#" class="btn btn-success">Read More</a>
            </div>
        </div>

        <!-- Text Colors -->
        <div class="mt-4">
            <h3 class="text-danger">Red Text</h3>
            <h3 class="text-success">Green Text</h3>
            <h3 class="text-warning">Yellow Text</h3>
        </div>

        <!-- Background Colors -->
        <div class="bg-info text-dark p-3 mt-3">
            Info Background
        </div>

        <div class="bg-dark text-white p-3 mt-2">
            Dark Background
        </div>

    </div>

</body>
</html>
